
services:

  database:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: hotel_reservation
      MYSQL_USER: hotel_app
      MYSQL_PASSWORD: ${HOTEL_DB_PASSWORD:?Set HOTEL_DB_PASSWORD before running Docker Compose}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"

    volumes:
      - hotel_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysql -h 127.0.0.1 -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" -e "SELECT 1" > /dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend

    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/hotel_reservation
      SPRING_DATASOURCE_USERNAME: hotel_app
      HOTEL_DB_PASSWORD: ${HOTEL_DB_PASSWORD:?Set HOTEL_DB_PASSWORD before running Docker Compose}

    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    ports:
      - "8088:80"

    depends_on:
      - backend

volumes:
  hotel_mysql_data:
