spring.application.name=hotel-backend

# MySQL database connection
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_reservation
spring.datasource.username=hotel_app
spring.datasource.password=${HOTEL_DB_PASSWORD}

# Database configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Backend network port
server.port=8082